# Render Blueprint — FREE tier.
#
# Free Render has no Background Worker and only 512 MB web instances, so the full
# four-service topology doesn't fit. This blueprint deploys ONLY the Node API as
# a single free web service that ALSO runs the BullMQ workers in-process
# (RUN_WORKERS_IN_WEB=true, handled in apps/api/src/start.ts). The rest of the
# stack lives off Render on free tiers:
#   • Dashboard  → Vercel            (vercel.json)
#   • ML service → Google Cloud Run   (apps/ml-service/Dockerfile, torch image) → ML_SERVICE_URL
#   • Redis      → Upstash            → REDIS_URL
#   • DB / media → Supabase / Cloudinary (managed)
#
# No secret value is committed — all are sync:false (entered in the Render
# dashboard). Free web services sleep after ~15 min idle (cold start on wake).

envVarGroups:
  - name: panchnama-shared-secrets
    envVars:
      - key: INTERNAL_JWT_SECRET # MUST equal the value set on the HF ML Space
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

services:
  # ---- Node API (Fastify) + BullMQ workers in the same free web service ----
  - type: web
    name: panchnama-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@panchnama/api
    startCommand: node apps/api/dist/start.js
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - fromGroup: panchnama-shared-secrets
      - key: NODE_ENV
        value: production
      - key: RUN_WORKERS_IN_WEB # free tier: no separate worker service
        value: "true"
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        value: verified_capture
      - key: DASHBOARD_URL # your Vercel dashboard URL (CORS + invite links)
        sync: false
      - key: REDIS_URL # Upstash free Redis connection string (rediss://…)
        sync: false
      - key: ML_SERVICE_URL # your Cloud Run URL, e.g. https://panchnama-ml-xxxx.run.app
        sync: false
      - key: ORG_UPLOAD_RATE_MAX
        value: "600"
      - key: ORG_UPLOAD_RATE_WINDOW_MS
        value: "60000"
