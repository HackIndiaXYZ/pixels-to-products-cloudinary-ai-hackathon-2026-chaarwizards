[project]
name = "impact-ml-service"
version = "0.0.0"
description = "AI media intelligence — computer-vision ML service (FastAPI, PyTorch, YOLOv8, ChangeFormer)"
requires-python = ">=3.11"
# Runtime dependencies (torch, ultralytics, fastapi, cloudinary, ...) land in
# Phase 6. Phase 0 ships only the toolchain + package skeleton.
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.9", "mypy==1.13.0", "pytest==8.3.4", "black==24.10.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
