[project]
name = "impact-ml-service"
version = "0.0.0"
description = "AI media intelligence — computer-vision ML service (FastAPI, PyTorch, YOLOv8, ChangeFormer)"
requires-python = ">=3.11"
# Runtime dependencies (torch, ultralytics, fastapi, cloudinary, ...) land in
# Phase 6. Phase 0 ships only the toolchain + package skeleton.
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.9", "mypy==1.13.0", "pytest==8.3.4", "black==24.10.0", "pytest-cov==7.1.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# FastAPI's dependency-injection idiom puts `Depends(...)` / `Query(...)` /
# `Header(...)` calls in argument defaults; they are evaluated once and are safe.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src"]

# Third-party libraries without usable type stubs are wrapped at the module
# boundary; their stubs are skipped here rather than sprinkling `type: ignore`.
# opencv ships partial stubs whose MatLike alias fights our uint8 arrays, so we
# skip following it and treat cv2 as untyped at the boundary.
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

# torch / ultralytics ship incomplete type exports: when they are NOT installed
# (the CI gate env) ignore_missing_imports treats them as Any, but once the
# learned-weights extras ARE installed (training/eval) mypy follows the real
# modules and their partial stubs fight our usage (YOLO not exported, Results |
# Tensor unions). Skip following them at the boundary exactly like cv2, so the
# strict check is identical in both environments.
[[tool.mypy.overrides]]
module = [
  "torch",
  "torch.*",
  "ultralytics",
  "ultralytics.*",
  "onnxruntime",
  "onnxruntime.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "jose",
  "jose.*",
  "cloudinary",
  "cloudinary.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Phase — "ML 70%". The threshold is ENFORCED: pytest exits
# non-zero when coverage drops below 70%, so CI fails the build. `main.py` is the
# uvicorn entrypoint and `models/forestry.py` needs torch/ultralytics (lazy,
# not installed in the gate env), so both are omitted rather than counted as a
# false 0% — the pure application logic that remains clears 70% honestly.
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
omit = [
  "src/main.py",
  "src/models/forestry.py",
  "src/models/water.py",
  "src/models/onnx_change.py",
]
